<style>
/* Layout : barre de heros collante, puis une fiche par heros en grille de panneaux (2 colonnes, 1 sur mobile) */
:root{

}

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;min-width:0;flex:1}
.tab{font:500 14px var(--body);color:var(--ink);background:none;border:1px solid transparent;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--accent-soft)}
.tab[aria-current="true"]{background:var(--accent);color:var(--panel)}
.tab:disabled{color:var(--mute);opacity:.55;cursor:default;background:none}
.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:24px 48px}
.hero-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
h1{font:700 clamp(30px,5vw,44px)/1.05 var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mute);font-size:14px}
.meta b{color:var(--ink);font-family:var(--mono);font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

.panel.full{grid-column:1/-1}

h2{font:600 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
h3{font:600 13px var(--body);margin:16px 0 6px;color:var(--mute)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 34% 52px;gap:10px;align-items:center;padding:3px 0}
.row .lab{overflow-wrap:anywhere}
.row.core .lab{font-weight:600}
.row .v{text-align:right;font:13px var(--mono);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px}
.row.core .fill{background:var(--core)}
.tag{display:inline-block;font:600 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--core);border:1px solid currentColor;border-radius:3px;padding:2px 4px;margin-left:6px;vertical-align:2px}
.prio{font:500 15px var(--body);margin:0 0 12px}
.prio b{font-weight:600}
.prio .gt{color:var(--mute);margin:0 6px}
.statrow{display:grid;grid-template-columns:90px minmax(0,1fr) 120px;gap:10px;align-items:center;padding:5px 0}
.range{position:relative;height:10px;background:var(--track);border-radius:5px}
.range .iqr{position:absolute;top:0;bottom:0;background:var(--accent-soft);border:1px solid var(--accent);border-radius:5px}
.range .med{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:var(--accent);border-radius:2px}
.statrow .v{text-align:right;font:13px var(--mono)}
.statrow .v small{color:var(--mute)}
dl.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;margin:12px 0 0;font-size:14px}
dl.kv dt{color:var(--mute)} dl.kv dd{margin:0;text-align:right;font-family:var(--mono)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0;border:1px solid var(--line)}
.combos{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink)}
.combos li{margin:4px 0}
.combos .p{font-family:var(--mono);color:var(--mute);margin-right:6px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
td.n small{color:var(--mute)}
.slots td:first-child{font-weight:600;white-space:nowrap;width:1%}
.it{display:inline-block;margin:0 14px 2px 0}
.it .p{font:12px var(--mono);color:var(--mute);margin-left:4px}
.it{color:var(--mute)}
.it.maj{color:var(--ink);font-weight:600;background:color-mix(in srgb,var(--core) 14%,var(--panel));border:1px solid var(--core);border-radius:4px;padding:2px 8px}
.it.maj .p{color:var(--core);font-weight:600}
.it.leg{color:var(--legend)}
.note{color:var(--mute);font-size:12.5px;margin:8px 0 0}
.empty{color:var(--mute);font-size:14px;margin:0}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.mode{font:500 13.5px var(--body);border:0;background:none;color:var(--ink);padding:7px 14px;cursor:pointer}
.mode+.mode{border-left:1px solid var(--line)}
.mode[aria-selected="true"]{background:var(--accent);color:var(--panel)}
.mode:focus-visible,.btn:focus-visible,.pick:focus-visible,.opt:focus-visible,.tiers button:focus-visible,.step button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.planbar{margin-bottom:16px;display:grid;gap:10px}
.pb-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.pb-row label{font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#buildSel,#buildName,.pb-box textarea,.pstat input[type=number]{font:14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#buildSel{min-width:160px} #buildName{flex:1;min-width:160px;max-width:320px}
.btn{font:500 13px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent)} .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn.danger{color:#b3261e;border-color:color-mix(in srgb,#b3261e 40%,var(--line))}
.pb-box{display:grid;gap:6px} .pb-box label{font-size:13px;color:var(--mute)} .pb-box textarea{width:100%;font:12px var(--mono);resize:vertical} .pb-box .btn{justify-self:start}
.pb-msg{margin:0;font-size:13.5px;color:var(--core);font-weight:600}
.saved{font:12px var(--mono);color:var(--core);opacity:0;transition:opacity .2s} .saved.on{opacity:1}
.h2x{font:500 12px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink);margin-left:8px}
.pick{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--panel);--h:0}
.pick:hover{border-color:var(--accent)}
.pick.sel{border:2px solid var(--accent);background:var(--accent-soft);padding:7px}
.pick.sel .nm{font-weight:600} .pick .cnt b{color:var(--accent);font-weight:600}
.pick:not(.sel) .ic img{filter:grayscale(.7);opacity:.75}
.pick.nofit{opacity:.45;cursor:not-allowed}
.h2x.over{color:#b3261e}
.pstat{display:grid;grid-template-columns:80px minmax(0,1fr) 70px;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pstat input[type=range]{width:100%;accent-color:var(--accent)}
.pstat input[type=number]{width:70px;font-family:var(--mono);text-align:right}
.pstat .ref{grid-column:2/-1;font:12px var(--mono);color:var(--mute)}
.pgem{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;align-items:center;padding:5px 0}
.tiers{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tiers button{flex:1;font:12px var(--mono);border:0;background:var(--panel);color:var(--ink);padding:6px 2px;cursor:pointer;position:relative}
.tiers button+button{border-left:1px solid var(--line)}
.tiers button[aria-pressed="true"]{background:var(--c);color:#fff;font-weight:600}
.tiers button[data-i="0"][aria-pressed="true"]{background:var(--mute)}
.tiers button[data-k="Diamond"][aria-pressed="true"]:not([data-i="0"]),.tiers button[data-k="Topaz"][aria-pressed="true"]:not([data-i="0"]){color:#1b2430}
.tiers button i{font-style:normal;font-size:10px;margin-left:3px;color:var(--legend)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.prow:not(.on) .pn{color:var(--mute)} .prow.on .pn{font-weight:600}
.prow .ref{grid-row:2;font:11.5px var(--mono);color:var(--mute);padding-left:37px}
.prow .step{grid-row:1/3;grid-column:2}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.step button{width:30px;height:30px;border:0;background:var(--panel);color:var(--ink);font:600 16px var(--body);cursor:pointer}
.step button:hover{background:var(--accent-soft)}
.step b{min-width:30px;text-align:center;font:600 14px var(--mono)}
.prow.on .step{border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:13.5px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.opt small{color:var(--mute);font-family:var(--mono)}
.opt.sel{border:2px solid var(--accent);background:var(--accent-soft);padding:4px 9px;font-weight:600}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .ic{margin-right:0}
@media (max-width:480px){.pgem{grid-template-columns:1fr}.pstat{grid-template-columns:70px minmax(0,1fr) 64px}}
.grow,.gtl{display:grid;grid-template-columns:100px minmax(0,1fr) 52px;gap:10px;align-items:center;padding:4px 0}
.grow .v{text-align:right;font:600 13px var(--mono)}
.stack{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--track)}

.seg.t0{background:var(--track);color:var(--mute)}

.seg.t3.lt{color:#1b2430}

.gleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.gleg i.t0{background:var(--track)} .gleg i.t1{background:color-mix(in srgb,var(--mute) 30%,var(--panel))}

.ic{position:relative;flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font:600 10px var(--body);text-transform:uppercase;overflow:hidden;margin-right:8px;vertical-align:middle;border:1px solid var(--line)}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.tile{--h:0;display:flex;align-items:center;gap:14px;padding:8px;border:1px solid color-mix(in srgb,var(--core) calc(var(--h)*80%),var(--line));border-radius:8px;background:color-mix(in srgb,var(--core) calc(var(--h)*38%),var(--panel))}
.tile .icw{position:relative;flex:none}
.tile .ic.lg{width:60px;height:60px;font-size:16px;border-radius:6px}
.tile .badge{position:absolute;right:-6px;bottom:-6px;min-width:34px;padding:2px 5px;border-radius:5px;background:var(--ink);color:var(--panel);font:600 12px/1.2 var(--mono);text-align:center;box-shadow:0 0 0 2px var(--panel)}
.tile .tx{min-width:0}
.tile .nm{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.tile .cnt{font:12px var(--mono);color:var(--mute);margin-top:2px} .tile .cnt b{color:var(--ink);font-weight:500}
.tile.core .nm{font-weight:600}
.tgrid.game{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.tgrid.game{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.tgrid.game{grid-template-columns:minmax(0,1fr)}}
.tile.none{opacity:.55}
.range .mm{position:absolute;top:4px;height:2px;background:var(--mute);opacity:.6}
.axis{display:grid;grid-template-columns:90px minmax(0,1fr) 120px;gap:10px}
.ticks{position:relative;height:16px;font:11px var(--mono);color:var(--mute)}
.ticks i{position:absolute;transform:translateX(-50%);font-style:normal}
.ticks i:first-child{transform:none}
.statrow .v b{font:600 17px var(--mono);color:var(--ink)}
table.other{margin-top:14px}
.other td.n b{font-weight:600}
table.heat{min-width:380px}
.heat th.c,.heat td.c{text-align:center;font-family:var(--mono);width:34px;padding:6px 2px}
.heat td.n small{display:block}
.cols2{columns:2;column-gap:32px}
.cols2 .row{break-inside:avoid}
@media (max-width:760px){.cols2{columns:1}}
.heat td.c{background:color-mix(in srgb,var(--accent) calc(var(--a,0)*100%),transparent);color:var(--ink);border-left:2px solid var(--panel)}
.heat td.c.hot{color:var(--panel);font-weight:500}
.heat td.c.zero{background:none}
.heat tr.core td:first-child{font-weight:600}
footer{color:var(--mute);font-size:13px;padding-block:0 32px}
@media (max-width:480px){.statrow,.axis{grid-template-columns:72px minmax(0,1fr) 92px}.row{grid-template-columns:minmax(0,1fr) 28% 46px}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .35s ease}}
</style>

function talentList(A){
  const lay = TALENT_LAYOUT[hero];
  if(!lay) return A.talents;
  const by = new Map(A.talents.map(t => [t.name.toLowerCase(), t]));
  const seen = new Set();
  const out = lay.map(([name, cost]) => { const t = by.get(name.toLowerCase()); if(t) seen.add(t.name);
    return t ? {...t, cost} : {name, cost, n:0, pct:0}; });
  return out.concat(A.talents.filter(t => !seen.has(t.name)));   // talent absent de la liste : a la fin
}

}
// Lien vers la fiche fellows.gg (numero du jeu : 2xxxxxx talent, 3xxxxxx trait/cou, 4xxxxxx benediction)
const FG_TYPES = {2:"talent", 3:"weapon-trait", 4:"blessing"};
const slug = n => n.toLowerCase().replace(/['’]/g,"").replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function fellowsUrl(name){
  const ids = DATA.ids || {}; let id = ids[name];
  if(id == null){ const k = Object.keys(ids).find(x => x.toLowerCase() === name.toLowerCase()); if(k) id = ids[k]; }
  const kind = id ? FG_TYPES[Math.floor(id / 1000000)] : null;
  return kind ? `https://fellows.gg/${kind}/${id % 1000000}/${slug(name)}` : "";
}
function tipInfo(name){
  const H = DATA.heroes[hero]; if(!H) return {type:"", lines:[]};
  const A = (mode !== "plan" && enc !== "all") ? H.byEncounter[enc] : H.all;
  const lc = name.toLowerCase(), find = l => (l||[]).find(x => x.name.toLowerCase() === lc);
  const md = v => v==null ? "–" : fr(v, v%1?1:0);
  let x;
  if((x = find(talentList(A)))) return {type:"Talent", lines:[x.cost?`Coût ${x.cost}`:"", `Pris par ${P(x.pct)} du top 30 (${x.n} / ${A.n})`]};
  if((x = find(A.traits))) return {type:isAspect(x.name)?"Aspect":"Sigil", lines:[`Porté par ${P(x.pct)} du top 30`, `Rang médian ${md(x.median)}`]};
  if((x = find(A.blessings))) return {type:"Bénédiction", lines:[`Portée par ${P(x.pct)} du top 30`, `Niveau médian ${md(x.median)}`]};
  if((x = find(A.neck))) return {type:"Choix du cou", lines:[`Pris par ${P(x.pct)} du top 30`]};
  if((x = find(A.enchants))) return {type:"Enchantement", lines:[`Porté par ${P(x.pct)} du top 30`, `Total médian ${md(x.median)}`]};
  if(isAspect(name)) return {type:"Aspect", lines:["Peu joué dans le top 30"]};
  return {type:"", lines:[]};
}
function ic(name, cls=""){
  const f = iconFor(name), url = fellowsUrl(name);

// Repartition des niveaux : une colonne par niveau total, intensite = part des builds de la ligne
function heatTable(list, head){
  if(!list.length) return '<p class="empty">Aucune donnée.</p>';
  const keys = [...new Set(list.flatMap(x=>Object.keys(x.dist||{})))].map(Number).filter(k=>k>0).sort((a,b)=>a-b);
  const lab = k => k===0 ? "arme" : (k>=8 ? "8+" : k);
  return `<div class="scroll"><table class="heat"><thead><tr><th>${head}</th><th class="n">Builds</th><th class="n">Méd.</th>${
    keys.map(k=>`<th class="c">${lab(k)}</th>`).join("")}</tr></thead><tbody>${
    list.map(x=>{
      const tot = Object.values(x.dist||{}).reduce((a,b)=>a+b,0) || 1;
      return `<tr class="${x.pct>=50?"core":""}"><td><span class="nmc">${ic(x.name)}${esc(x.name)}</span></td><td class="n">${x.n} <small>(${P(x.pct)})</small></td><td class="n">${fr(x.median,x.median%1?1:0)}</td>${
        keys.map(k=>{ const c=(x.dist||{})[k]||0; const a=c?0.12+0.88*c/tot:0;
          return `<td class="c${c?"":" zero"}${a>0.6?" hot":""}" style="--a:${a.toFixed(2)}" title="${c} build(s) au niveau ${lab(k)}">${c||""}</td>`; }).join("")}</tr>`;
    }).join("")}</tbody></table></div>`;
}

function emptyBuild(name){
  return {name, talents:[], stats:{}, gems:{}, neck:[], legendary:"", special:"", aspects:{}, sigils:{}, blessings:{}};
}
function topBuild(name){
  const A = DATA.heroes[hero].all, b = emptyBuild(name);
  let pts = 0;
  b.talents = talentList(A).filter(t=>t.pct>=50).sort((x,y)=>y.pct-x.pct)
    .filter(t=>{ const c=t.cost||0; if(pts+c>TALENT_POINTS) return false; pts+=c; return true; }).map(t=>t.name);
  A.secondary.forEach(s=>{ b.stats[s.key] = Math.round(s.raw); });
  if(A.gemTiers) for(const k of GEM_ORDER){ const tr=A.gemTiers[k]; if(tr) b.gems[k] = tr.indexOf(Math.max(...tr)); }
  b.neck = A.neck.slice(0,3).map(x=>x.name);
  b.legendary = A.legendary[0] ? A.legendary[0].name : "";
  b.special = A.special[0] ? A.special[0].name : "";
  for(const t of A.traits) if(t.pct>=50) (isAspect(t.name)?b.aspects:b.sigils)[t.name] = Math.max(1, Math.round(t.median||1));
  for(const x of A.blessings) if(x.pct>=50) b.blessings[x.name] = Math.max(1, Math.round(x.median||1));
  return b;
}

        <input type="range" id="st-${k}" min="0" max="${STAT_MAX}" step="1" value="${v}" data-stat="${k}">
        <input type="number" id="stn-${k}" min="0" max="999" step="1" value="${v}" data-stat="${k}" aria-label="${STAT_FR[k]} (valeur)">
        <span class="ref">${s?`top 30 : ${fr(s.raw)} (${fr(s.q1)} – ${fr(s.q3)})`:""}</span></div>`}).join("")}
      <p class="note">Valeurs brutes. Entre parenthèses : la zone où se trouve la moitié du top 30.</p>
    </section>

    <section class="panel">
      <h2>Paliers de gemmes visés</h2>
      ${GEM_ORDER.map(k=>{const tr=A.gemTiers?A.gemTiers[k]:null; const v=B.gems[k]??0; const top=tr?tr.indexOf(Math.max(...tr)):-1; return `<div class="pgem">
        <span class="lab"><span class="dot" style="background:${GEM[k][1]}"></span>${GEM[k][0]}</span>
        <span class="tiers" role="group" aria-label="${GEM[k][0]}">${TIER_LAB.map((l,i)=>`<button type="button" data-act="gem" data-k="${k}" data-i="${i}" aria-pressed="${v===i}" style="--c:${GEM[k][1]}">${l}${i===top?"<i>★</i>":""}</button>`).join("")}</span></div>`}).join("")}
      <p class="note">★ : palier le plus fréquent dans le top 30.</p>
    </section>

    <section class="panel">
      <h2>Aspects visés</h2>
      ${asp.map(n=>stepper("aspects",n,B.aspects[n]||0,refT(n))).join("")||'<p class="empty">Aucune donnée.</p>'}
    </section>
    <section class="panel">
      <h2>Sigils visés</h2>
      ${sig.map(n=>stepper("sigils",n,B.sigils[n]||0,refT(n))).join("")||'<p class="empty">Aucune donnée.</p>'}
    </section>

    <section class="panel">
      <h2>Bénédictions visées</h2>
      ${listWith(A.blessings,B.blessings).map(n=>stepper("blessings",n,B.blessings[n]||0,refB(n))).join("")}
      <p class="note">Rang ou niveau total visé sur l'équipement. « – » : non pris.</p>
    </section>

    <section class="panel">
      <h2>Légendaire</h2>
      <div class="opts">${A.legendary.map(l=>`<button type="button" class="opt${B.legendary===l.name?" sel":""}" data-act="leg" data-n="${esc(l.name)}" aria-pressed="${B.legendary===l.name}"><span class="it leg" style="margin:0">${esc(l.name)}</span> <small>${l.slot} · ${P(l.pct)}</small></button>`).join("")}</div>
      ${A.special.length?`<h3>Effet spécial</h3><div class="opts">${A.special.map(s=>`<button type="button" class="opt${B.special===s.name?" sel":""}" data-act="spe" data-n="${esc(s.name)}" aria-pressed="${B.special===s.name}">${esc(s.name)} <small>${P(s.pct)}</small></button>`).join("")}</div>`:""}
      <h3>Cou <span class="h2x">${B.neck.length} / 3</span></h3>
      <div class="opts">${A.neck.map(x=>{const on=B.neck.includes(x.name);return `<button type="button" class="opt${on?" sel":""}" data-act="neck" data-n="${esc(x.name)}" aria-pressed="${on}" ${!on&&B.neck.length>=3?"disabled":""}><span class="nmc">${ic(x.name)}${esc(x.name)}</span> <small>${P(x.pct)}</small></button>`}).join("")}</div>
    </section>
  </div>`;
}

function planClick(t){
  const S = heroStore(), B = S.builds[S.cur], act = t.dataset.act, n = t.dataset.n;
  planUi.msg = "";
  if(act!=="del") planUi.del = false;
  switch(act){
    case "tal": {
      if(B.talents.includes(n)){ B.talents = B.talents.filter(x=>x!==n); break; }
      const tl = talentList(DATA.heroes[hero].all), costOf = x => (tl.find(t=>t.name===x)||{}).cost || 0;
      const used = B.talents.reduce((s,x)=>s+costOf(x),0);
      if(used + costOf(n) > TALENT_POINTS){ flash(`Limite de ${TALENT_POINTS} points atteinte : retire un talent d'abord`); return; }
      B.talents = B.talents.concat(n); break; }
    case "gem": B.gems[t.dataset.k] = +t.dataset.i; break;
    case "inc": case "dec": { const g = B[t.dataset.g]; const v = Math.max(0, Math.min(8, (g[n]||0) + (act==="inc"?1:-1))); if(v) g[n]=v; else delete g[n]; break; }
    case "leg": B.legendary = B.legendary===n ? "" : n; break;
    case "spe": B.special = B.special===n ? "" : n; break;
    case "neck": B.neck = B.neck.includes(n) ? B.neck.filter(x=>x!==n) : (B.neck.length<3 ? B.neck.concat(n) : B.neck); break;
    case "new-top": case "new-empty": { const id=newId(); const k=Object.keys(S.builds).length+1;
      S.builds[id] = act==="new-top" ? topBuild(`Build ${k}`) : emptyBuild(`Build ${k}`); S.cur=id; break; }
    case "dup": { const id=newId(); S.builds[id] = JSON.parse(JSON.stringify(B)); S.builds[id].name = (B.name+" (copie)").slice(0,40); S.cur=id; break; }
    case "del":
      if(!planUi.del){ planUi.del = true; renderPlan(); return; }
      delete S.builds[S.cur]; planUi.del = false; S.cur = Object.keys(S.builds)[0]; heroStore(); break;
    case "del-no": planUi.del = false; renderPlan(); return;
    case "exp": planUi.exp = !planUi.exp; planUi.imp = false; renderPlan(); return;
    case "imp": planUi.imp = !planUi.imp; planUi.exp = false; renderPlan(); return;
    case "copy": { const ta=$("#expCode"); const done=()=>flash("Code copié");
      if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, ()=>{ ta.select(); flash("Sélectionné : Ctrl+C pour copier"); });
      else { ta.select(); flash("Sélectionné : Ctrl+C pour copier"); } return; }
    case "imp-go": {
      let o; try{ o = JSON.parse(decodeURIComponent(escape(atob($("#impCode").value.trim())))); }catch(e){ o = null; }
      if(!o || !o.build || !o.hero || !DATA.heroes[o.hero]){ planUi.msg = "Code non reconnu : vérifie que tu as copié le code en entier."; renderPlan(); return; }
      const b = Object.assign(emptyBuild("Build importé"), o.build);
      if(o.hero !== hero){ hero = o.hero; }
      const S2 = heroStore(); const id = newId(); S2.builds[id] = b; S2.cur = id; planUi.imp = false;
      planUi.msg = `Build « ${b.name} » importé pour ${o.hero}.`; saveStore();
      if(location.hash.slice(1) !== hero) location.hash = hero; else { renderTabs(); renderPlan(); }
      return; }
    default: return;
  }
  saveStore(); renderPlan();
}

document.addEventListener("input", e => {
  if(mode !== "plan") return;
  const t = e.target;
  if(t.id === "buildName"){ const B = curBuild(); B.name = t.value.trim() || "Sans nom";
    const o = document.querySelector(`#buildSel option[value="${STORE[hero].cur}"]`); if(o) o.textContent = B.name; saveStore(); return; }
  if(t.dataset.stat){ const k = t.dataset.stat; const v = Math.max(0, Math.round(+t.value || 0)); curBuild().stats[k] = v;
    const other = document.getElementById((t.type==="range"?"stn-":"st-")+k); if(other) other.value = v; saveStore(); }
});
document.addEventListener("change", e => {
  if(mode === "plan" && e.target.id === "buildSel"){ heroStore().cur = e.target.value; planUi = {exp:false,imp:false,del:false,msg:""}; saveStore(); renderPlan(); }
});

function select(h){
  if(!DATA.heroes[h]) h = heroOrder().find(x=>DATA.heroes[x]);
  if(h !== hero){ enc = "all"; planUi = {exp:false,imp:false,del:false,msg:""}; }
  hero = h;
  try{ localStorage.setItem("hero", h); }catch(e){}
  renderTabs(); render();
}

document.addEventListener("click", e => {
  const t = e.target.closest(".tab"); if(t && !t.disabled){ location.hash = t.dataset.h; return; }
  const m = e.target.closest(".mode"); if(m){ mode = m.dataset.mode; try{ localStorage.setItem("mode", mode); }catch(err){} render(); return; }
  if(mode === "plan"){ const a = e.target.closest("[data-act]"); if(a && !a.disabled) planClick(a); return; }
  const c = e.target.closest(".chip"); if(c){ enc = c.dataset.e; render(); }
});
window.addEventListener("hashchange", () => select(decodeURIComponent(location.hash.slice(1))));

// Infobulle des icones + ouverture de la fiche fellows.gg au clic
const tipEl = document.createElement("div"); tipEl.id = "tip"; tipEl.hidden = true; tipEl.setAttribute("role","tooltip"); document.body.appendChild(tipEl);
function showTip(el){
  const name = el.dataset.tip, info = tipInfo(name), url = el.dataset.url;
  tipEl.innerHTML = `<div class="tt-h">${esc(name)}</div>${info.type?`<div class="tt-t">${info.type}</div>`:""}${
    info.lines.filter(Boolean).map(l=>`<div>${l}</div>`).join("")}${url?`<div class="tt-l">Clic : description complète sur fellows.gg ↗</div>`:""}`;
  tipEl.hidden = false;
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = r.left + r.width/2 - w/2, y = r.top - h - 8;
  x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
  if(y < 8) y = r.bottom + 8;
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
}
const hideTip = () => { tipEl.hidden = true; };
document.addEventListener("mouseover", e => { const el = e.target.closest(".ic[data-tip]"); if(el) showTip(el); else if(!e.target.closest("#tip")) hideTip(); });
document.addEventListener("focusin", e => { const el = e.target.closest(".ic[data-tip]"); if(el) showTip(el); });
document.addEventListener("focusout", hideTip);
window.addEventListener("scroll", hideTip, {passive:true});
function openFiche(el){ const a = document.createElement("a"); a.href = el.dataset.url; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); }
document.addEventListener("click", e => {
  const el = e.target.closest(".ic[data-url]"); if(!el) return;
  e.preventDefault(); e.stopPropagation(); hideTip(); openFiche(el);
}, true);
document.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest(".ic[data-url]");
  if(el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); e.stopPropagation(); openFiche(el); }
}, true);

(function init(){
  const d = new Date(DATA.generated);
  $("#foot").innerHTML = `Mis à jour le ${d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})} à ${d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})} · Données : classements Fellowship Logs (top 30 par héros et par donjon), médianes sans pondération.`;
  try{ mode = localStorage.getItem("mode") === "plan" ? "plan" : "stats"; }catch(e){}
  let start = decodeURIComponent(location.hash.slice(1));
  if(!DATA.heroes[start]){ try{ start = localStorage.getItem("hero") || ""; }catch(e){ start = ""; } }
  select(start || "Helena");
})();
</script>
