name: Mise en page du site

# Refait le site en quelques secondes avec les donnees deja publiees,
# sans relancer la collecte. Se declenche tout seul quand modele_site.html
# ou build_site.py change, ou a la main avec "Run workflow".
on:
  push:
    paths:
      - modele_site.html
      - build_site.py
      - descriptions.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generation du site
        run: python build_site.py --from-html docs/index.html -o docs/index.html

      - name: Publication
        run: |
          git config user.name "maj-auto"
          git config user.email "maj-auto@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Mise en page du site"
          git pull --rebase
          git push
