name: Mise en page du site

# Refait le site en quelques secondes avec les donnees deja publiees,
# sans relancer la collecte. Se declenche tout seul quand modele_site.html
# ou build_site.py change, ou a la main avec "Run workflow".
on:
  push:
    paths:
      - modele_site.html
      - build_site.py
      - descriptions.json
      - liens_fellows.json
      - gemmes.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # derniere version, meme si quelque chose a ete publie entre-temps

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generation du site
        run: python build_site.py --from-html docs/index.html -o docs/index.html

      - name: Publication
        env:
          REGEN: "python build_site.py --from-html docs/index.html -o docs/index.html"
        run: |
          git config user.name "maj-auto"
          git config user.email "maj-auto@users.noreply.github.com"
          publier() {
            git add docs/index.html
            git diff --cached --quiet && return 0
            git commit -q -m "Mise en page du site $(date -u +%F\ %Hh)"
          }
          publier
          for essai in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            # quelqu'un a publie pendant ce temps : on repart de la derniere version et on regenere
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            eval "$REGEN"
            publier
          done
          exit 1
