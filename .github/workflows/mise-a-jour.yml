name: Mise a jour du site

on:
  schedule:
    - cron: "17 4 * * *"      # chaque nuit vers 5 h (heure de Paris en hiver)
  workflow_dispatch:           # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # derniere version, meme si quelque chose a ete publie entre-temps

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reprend les reponses deja telechargees (les combats ne changent jamais)
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: Collecte des builds (Fellowship Logs)
        env:
          FELLOWSHIP_CLIENT_ID: ${{ secrets.FELLOWSHIP_CLIENT_ID }}
          FELLOWSHIP_CLIENT_SECRET: ${{ secrets.FELLOWSHIP_CLIENT_SECRET }}
        run: python comparer_builds.py --all --top 30 > collecte.log 2>&1 || (tail -40 collecte.log; exit 1)

      - name: Builds des joueurs suivis
        continue-on-error: true
        env:
          FELLOWSHIP_CLIENT_ID: ${{ secrets.FELLOWSHIP_CLIENT_ID }}
          FELLOWSHIP_CLIENT_SECRET: ${{ secrets.FELLOWSHIP_CLIENT_SECRET }}
        run: python suivre_joueurs.py

      # Sauvegarde le cache meme si la collecte a echoue a mi-chemin
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: api-cache-${{ github.run_id }}

      - name: Generation du site
        run: python build_site.py resultats/builds_*.json --joueurs resultats/joueurs_suivis.json -o docs/index.html

      - name: Publication
        env:
          REGEN: "python build_site.py resultats/builds_*.json --joueurs resultats/joueurs_suivis.json -o docs/index.html"
        run: |
          git config user.name "maj-auto"
          git config user.email "maj-auto@users.noreply.github.com"
          publier() {
            git add docs/index.html
            git diff --cached --quiet && return 0
            git commit -q -m "Mise a jour des builds $(date -u +%F\ %Hh)"
          }
          publier
          for essai in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            # quelqu'un a publie pendant ce temps : on repart de la derniere version et on regenere
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            eval "$REGEN"
            publier
          done
          exit 1
